<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ITCAN Group · Finance Dashboard</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.min.js"></script>
<style>
:root{
  --bg:#F5F6F8; --card:#FFFFFF; --ink:#1A2230; --muted:#6A7382; --faint:#A6AEBC;
  --line:#E6E9EF; --line2:#EEF0F4;
  --brand:#FA5523; --brand-mid:#F5915F; --brand-lt:#FBC4AF; --brand-wash:#FFF1EC;
  --blue:#2563EB; --blue-mid:#7CA6F5; --blue-lt:#C9DBFB; --blue-wash:#EFF4FE;
  --grey-bar:#C3CAD6;
  --green:#12805A; --green-lt:#E4F6ED; --red:#C43B1E; --red-lt:#FDE7E0;
  --side-bg:#1E2530; --side-line:#2A3240; --side-txt:#B8C0CC; --side-foot:#6A7383;
}
*{box-sizing:border-box;margin:0;padding:0}
html{-webkit-text-size-adjust:100%}
body{font-family:'Inter',system-ui,sans-serif;background:var(--bg);color:var(--ink);font-size:.85rem;line-height:1.45}
.tnum{font-variant-numeric:tabular-nums}
.app{display:flex;min-height:100vh}

/* ---------- Sidebar ---------- */
.side{width:198px;min-width:198px;background:var(--side-bg);border-right:1px solid var(--side-line);position:sticky;top:0;height:100vh;display:flex;flex-direction:column;padding:18px 12px 14px}
.logo{display:flex;align-items:center;gap:10px;padding:2px 8px 16px;border-bottom:1px solid var(--side-line);margin-bottom:14px}
.logo .tile{width:34px;height:34px;border-radius:9px;background:var(--brand);display:flex;align-items:center;justify-content:center;font-weight:800;color:#fff;font-size:.95rem;letter-spacing:-.02em}
.logo .nm{color:#fff;font-weight:700;font-size:.92rem;letter-spacing:-.01em}
.logo .sub{color:var(--side-foot);font-size:.66rem;font-weight:600;margin-top:1px}
.ngroup{color:var(--side-foot);font-size:.62rem;font-weight:700;letter-spacing:.09em;text-transform:uppercase;padding:12px 10px 5px}
.nav a{display:flex;align-items:center;gap:8px;color:var(--side-txt);text-decoration:none;font-size:.8rem;font-weight:500;padding:7px 10px;border-radius:8px;margin:1px 0;transition:background .15s}
.nav a:hover{background:rgba(255,255,255,.06)}
.nav a.on{background:var(--brand);color:#fff;font-weight:600}
.nav a .dot{width:6px;height:6px;border-radius:50%;background:currentColor;opacity:.55;flex:none}
.sfoot{margin-top:auto;padding:12px 10px 0;border-top:1px solid var(--side-line);color:var(--side-foot);font-size:.65rem;line-height:1.5}
.sfoot b{color:var(--side-txt);font-weight:600}
#lastfetch{color:var(--side-txt)}

/* ---------- Content ---------- */
.main{flex:1;max-width:1300px;padding:22px 30px 60px}
.page{display:none}
.page.on{display:block}
h1{font-size:1.5rem;font-weight:700;letter-spacing:-.02em}
.psub{color:var(--muted);font-size:.82rem;margin:3px 0 18px}
.grid{display:grid;grid-template-columns:repeat(12,1fr);gap:14px}
.card{background:var(--card);border:1px solid var(--line);border-radius:13px;padding:18px}
.card.p0{padding:0}
.card.p0 .chd{padding:16px 18px 0}
.col12{grid-column:span 12}.col8{grid-column:span 8}.col6{grid-column:span 6}.col4{grid-column:span 4}.col3{grid-column:span 3}
.eyebrow{font-size:.72rem;font-weight:600;color:var(--faint);text-transform:uppercase;letter-spacing:.06em}
.ctitle{font-size:1.05rem;font-weight:600;letter-spacing:-.01em;margin-top:2px}
.csub{font-size:.76rem;color:var(--muted);margin-top:2px}
.big{font-size:2rem;font-weight:700;letter-spacing:-.02em;margin-top:6px}
.big.sm{font-size:1.45rem}
.pos{color:var(--green)}.neg{color:var(--red)}
.chip{display:inline-flex;align-items:center;gap:4px;font-size:.68rem;font-weight:600;padding:2px 8px;border-radius:999px}
.chip.g{background:var(--green-lt);color:var(--green)}
.chip.r{background:var(--red-lt);color:var(--red)}
.chip.n{background:var(--line2);color:var(--muted)}
.chip.b{background:var(--blue-wash);color:var(--blue)}
.chip.o{background:var(--brand-wash);color:var(--brand)}
.ktiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:14px}
.legend{display:flex;gap:16px;flex-wrap:wrap;padding:8px 18px 14px;font-size:.72rem;color:var(--muted);font-weight:500}
.legend span{display:flex;align-items:center;gap:6px}
.sw{width:11px;height:11px;border-radius:3px;display:inline-block}
.chartbox{position:relative;padding:8px 12px 12px;height:300px}
.chartbox.tall{height:340px}.chartbox.short{height:220px}
canvas{max-width:100%}

/* ---------- Tables ---------- */
.twrap{overflow-x:auto;border-radius:0 0 13px 13px}
table{border-collapse:collapse;width:100%;font-size:.78rem}
th,td{padding:7px 11px;text-align:right;white-space:nowrap;border-bottom:1px solid var(--line2)}
th{font-size:.68rem;font-weight:600;color:var(--muted);text-transform:uppercase;letter-spacing:.04em;position:sticky;top:0;background:var(--card);z-index:2}
th:first-child,td:first-child{text-align:left;position:sticky;left:0;background:var(--card);z-index:1;max-width:230px;overflow:hidden;text-overflow:ellipsis}
th:first-child{z-index:3}
tr:hover td{background:var(--brand-wash)}
tr:hover td:first-child{background:var(--brand-wash)}
tr.band td{background:var(--ink);color:#fff;font-weight:600;border-bottom:none}
tr.band td:first-child{background:var(--ink)}
tr.band:hover td{background:var(--ink)}
tr.subtot td{font-weight:600;background:var(--line2)}
tr.subtot td:first-child{background:var(--line2)}
tr.muted td{color:var(--faint)}
td.act{color:var(--ink)} td.fct{color:var(--muted)}
th.mo-a{color:var(--brand)} th.mo-f{color:var(--blue)}
th.mo-a-c{color:var(--blue)} th.mo-f-c{color:#8b93a3}
.indent td:first-child{padding-left:26px;color:var(--muted)}

/* ---------- misc ---------- */
.spark{height:34px;margin-top:8px}
.hrow{display:flex;justify-content:space-between;align-items:baseline;gap:10px;flex-wrap:wrap}
.statline{display:flex;justify-content:space-between;font-size:.78rem;padding:6px 0;border-bottom:1px solid var(--line2)}
.statline:last-child{border-bottom:none}
.statline .l{color:var(--muted)}
.statline .v{font-weight:600}
.note{font-size:.76rem;color:var(--muted);background:var(--line2);border-radius:9px;padding:10px 13px;margin-top:12px;line-height:1.5}
.err{background:var(--red-lt);color:var(--red);border-radius:9px;padding:10px 13px;font-size:.78rem;margin-bottom:14px;display:none}
.load{position:fixed;inset:0;background:var(--bg);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;z-index:99}
.load .ring{width:38px;height:38px;border:3px solid var(--line);border-top-color:var(--brand);border-radius:50%;animation:spin .8s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.load p{color:var(--muted);font-size:.82rem}
.hstat{border-left:3px solid var(--line);padding-left:12px}
.hstat.ok{border-color:var(--green)} .hstat.bad{border-color:var(--red)}
.mono{font-family:ui-monospace,Menlo,monospace;font-size:.72rem;word-break:break-all;color:var(--muted)}
.method p{margin:8px 0;color:var(--ink)}
.method h3{font-size:.92rem;margin:16px 0 4px}
.method code{background:var(--line2);border-radius:5px;padding:1px 6px;font-size:.76rem}

@media (max-width:1080px){.col8,.col6,.col4,.col3{grid-column:span 12}}
@media (max-width:900px){
  .app{flex-direction:column}
  .side{width:100%;min-width:0;height:auto;position:static;flex-direction:row;flex-wrap:wrap;align-items:center;gap:4px;padding:10px 12px}
  .logo{border-bottom:none;padding:0 10px 0 0;margin:0}
  .ngroup{display:none}
  .nav{display:flex;flex-wrap:wrap}
  .sfoot{display:none}
  .main{padding:16px 14px 50px}
}
@media (prefers-reduced-motion:reduce){.load .ring{animation:none}}
</style>

<body>

<div class="load" id="loader"><div class="ring"></div><p id="loadmsg">Fetching live data from Google Sheets…</p></div>

<div class="app">
  <aside class="side">
    <div class="logo">
      <div class="tile">IT</div>
      <div><div class="nm">ITCAN Group</div><div class="sub">Finance · 2026 Live</div></div>
    </div>
    <nav class="nav" id="nav">

  <main class="main">
    <div class="err" id="errbar"></div>

    <section class="page" id="pg-pnl-moontech"></section>
    <section class="page" id="pg-pnl-cpx"></section>
    <section class="page" id="pg-cash-moontech"></section>

    <section class="page" id="pg-vc"></section>
    <section class="page" id="pg-health"></section>
  </main>
</div>

<script>
/* ================================================================
   CONFIG — the only block you touch month to month
   ================================================================ */
const CONFIG = {
  // 0-based month index of the LAST month with real actuals (6 = July).
  // Flip this each month after the sheets are updated.
  LAST_ACTUAL: { pnl: 6, cash: 6 },

  PNL_BASE:  "https://docs.google.com/spreadsheets/d/e/2PACX-1vQfPFBUeCjHeO4nNYzCjakS9WH5PfBrM5N136EiwKKynrG38wbaT-2ReAvO6UuIA8Ue2CdkmJNtXmvl/pub",
  CASH_BASE: "https://docs.google.com/spreadsheets/d/e/2PACX-1vQ_g4Q_5DS_AIsNAtS7RZ0esPY-ntwHLpm1rJ1m1zY8tMcYrXFmb2xj_UaY1ov88Yc235VHdUSHLozg/pub",

  TABS: {
    pnl_group:   { base:"pnl",  gid:"2082897314", label:"P&L · Live (Group) 23M" },
    pnl_cpx:     { base:"pnl",  gid:"312525118",  label:"P&L · Live (ITCAN+CPX/MARS)" },
    pnl_moon:    { base:"pnl",  gid:"1487839714", label:"P&L · Live Moontech" },
    pnl_rva:     { base:"pnl",  gid:"116096348",  label:"P&L · Realistic VS Actual" },
    cf_invest:   { base:"cash", gid:"1232387704", label:"Cashflow · Investment Summary", plain:true },
    cf_group:    { base:"cash", gid:"1922464043", label:"Cashflow · (Group) Live" },
    cf_moon:     { base:"cash", gid:"888714563",  label:"Cashflow · Moontech Live" },
    cf_cpx:      { base:"cash", gid:"1796161324", label:"Cashflow · (ITCAN+CPX) Live" },
    cf_var:      { base:"cash", gid:"956136770",  label:"Cashflow · Variance" }
  },
  FY_TARGET: 23000000
};

/* ================================================================
   ENGINE — CSV + tab parsing (verified against real exports)
   ================================================================ */
const MONTHS = ["January","February","March","April","May","June","July","August","September","October","November","December"];
const MONTHS_S = ["Jan","Feb","Mar","Apr","May","Jun","Jul","Aug","Sep","Oct","Nov","Dec"];

function parseCSV(text){
  const rows=[]; let row=[], cur="", inQ=false;
  for(let i=0;i<text.length;i++){
    const c=text[i];
    if(inQ){ if(c==='"'){ if(text[i+1]==='"'){cur+='"';i++;} else inQ=false; } else cur+=c; }
    else{
      if(c==='"') inQ=true;
      else if(c===','){ row.push(cur); cur=""; }
      else if(c==='\n'){ row.push(cur); rows.push(row); row=[]; cur=""; }
      else if(c==='\r'){}
      else cur+=c;
    }
  }
  if(cur.length||row.length){ row.push(cur); rows.push(row); }
  return rows;
}
function num(s){
  if(s==null) return null;
  s=String(s).trim();
  if(s===""||s==="-") return null;
  let neg=false;
  if(/^\(.*\)$/.test(s)){neg=true;s=s.slice(1,-1);}
  s=s.replace(/[$,\s%]/g,"").replace(/AED/gi,"");
  if(s===""||s==="-") return null;
  const v=parseFloat(s);
  if(isNaN(v)) return null;
  return neg?-v:v;
}
function isPctRow(cells){
  let p=0,n=0;
  cells.forEach(c=>{c=String(c).trim(); if(c){n++; if(c.endsWith("%"))p++;}});
  return n>0 && p/n>0.6;
}
function findMonthHeader(rows){
  for(let r=0;r<Math.min(rows.length,15);r++){
    const cols={};
    (rows[r]||[]).forEach((c,i)=>{
      const t=String(c).trim().toLowerCase();
      const mi=MONTHS.findIndex(m=>m.toLowerCase()===t);
      if(mi>=0) cols[i]=mi;
    });
    if(Object.keys(cols).length>=6) return {rowIdx:r, cols};
  }
  return null;
}
function parseFinTab(rows){
  const hdr=findMonthHeader(rows);
  if(!hdr) return {error:"No month header row found", rows:[], layout:"?"};
  const monthCols=hdr.cols;
  const colIdxs=Object.keys(monthCols).map(Number).sort((a,b)=>a-b);
  let paired=false;
  const sub=rows[hdr.rowIdx+1]||[];
  const subVals=sub.map(c=>String(c).trim().toLowerCase());
  if(subVals.includes("forecast")&&subVals.includes("actual")) paired=true;
  const dataStart=hdr.rowIdx+(paired?2:1);
  const out=[];
  for(let r=dataStart;r<rows.length;r++){
    const cells=rows[r]||[];
    const label=String(cells[0]||"").trim();
    if(!label) continue;
    const pct=isPctRow(cells.slice(1));
    const f=new Array(12).fill(null), a=new Array(12).fill(null);
    colIdxs.forEach(ci=>{
      const mi=monthCols[ci];
      if(paired){ f[mi]=num(cells[ci]); a[mi]=num(cells[ci+1]); }
      else{ f[mi]=num(cells[ci]); }
    });
    out.push({label, f, a, pct, rowIdx:r});
  }
  const norm=s=>s.toLowerCase().replace(/[^a-z0-9]+/g," ").trim();
  return {
    layout:paired?"paired":"single",
    rows:out, hdrRow:hdr.rowIdx,
    find(label, after){ const t=norm(label); const start=after?out.indexOf(after)+1:0;
      for(let i=start;i<out.length;i++) if(norm(out[i].label)===t) return out[i]; return null; },
    findContains(frag, after){ const t=norm(frag); const start=after?out.indexOf(after)+1:0;
      for(let i=start;i<out.length;i++) if(norm(out[i].label).includes(t)) return out[i]; return null; },
    findAny(frags, after){ for(const fr of frags){ const r=this.findContains(fr, after); if(r) return r; } return null; },
    between(a,b){ const i=out.indexOf(a), j=out.indexOf(b); if(i<0||j<0||j<=i) return []; return out.slice(i+1,j); }
  };
}
function seriesVal(row, lastActualIdx, tab){
  const actual=new Array(12).fill(null), forecast=new Array(12).fill(null), display=new Array(12).fill(null);
  for(let m=0;m<12;m++){
    if(tab.layout==="paired"){
      const f=row.f[m], a=row.a[m];
      forecast[m]=f;
      if(m<=lastActualIdx){ actual[m]=a; display[m]=a; } else { display[m]=f; }
    }else{
      const v=row.f[m];
      display[m]=v;
      if(m<=lastActualIdx) actual[m]=v; else forecast[m]=v;
    }
  }
  return {actual,forecast,display};
}
function sum(arr,from=0,to=11){let s=0,any=false;for(let i=from;i<=to;i++){if(arr[i]!=null){s+=arr[i];any=true;}}return any?s:null;}

/* ================================================================
   FORMATTERS
   ================================================================ */
function money(v,cur){ if(v==null||isNaN(v)) return "—";
  const s=(cur||"AED")+" "+Math.round(Math.abs(v)).toLocaleString("en-US");
  return v<0?"-"+s:s; }
function moneyPlain(v){ if(v==null||isNaN(v)) return "—";
  const s=Math.round(Math.abs(v)).toLocaleString("en-US"); return v<0?"("+s+")":s; }
function fK(v){ if(v==null||isNaN(v)) return "—";
  const a=Math.abs(v), sg=v<0?"-":"";
  if(a>=1e6) return sg+(a/1e6).toFixed(1)+"M";
  if(a>=1e3) return sg+(a/1e3).toFixed(0)+"K";
  return sg+Math.round(a); }
function pct(v,d=0){ return (v==null||isNaN(v))?"—":(v*100).toFixed(d)+"%"; }
function signCls(v){ return v==null?"":(v<0?"neg":"pos"); }
function deltaChip(v, goodUp=true, fmt=fK){
  if(v==null||isNaN(v)) return '<span class="chip n">—</span>';
  const good = goodUp ? v>=0 : v<=0;
  const arrow = v>=0?"▲":"▼";
  return `<span class="chip ${good?'g':'r'}">${arrow} ${fmt(Math.abs(v))}</span>`;
}
function esc(s){return String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));}

/* ================================================================
   FETCH LAYER
   ================================================================ */
const STATE = { tabs:{}, health:{}, charts:[] };
function tabURL(key){
  const t=CONFIG.TABS[key];
  const base=t.base==="pnl"?CONFIG.PNL_BASE:CONFIG.CASH_BASE;
  return `${base}?gid=${t.gid}&single=true&output=csv`;
}
async function fetchTab(key){
  const url=tabURL(key);
  const h={key,label:CONFIG.TABS[key].label,url,ok:false,rows:0,layout:"—",anchors:[],missing:[],err:null};
  try{
    const res=await fetch(url,{redirect:"follow"});
    if(!res.ok) throw new Error("HTTP "+res.status);
    const text=await res.text();
    if(/<html/i.test(text.slice(0,300))) throw new Error("Got an HTML page, not CSV — is 'Publish to web → Entire document' enabled?");
    const grid=parseCSV(text);
    h.raw=grid;
    if(CONFIG.TABS[key].plain){
      h.ok=grid.length>1; h.rows=grid.length; h.layout="table";
      STATE.tabs[key]=null;
    }else{
      const tab=parseFinTab(grid);
      h.ok=!tab.error; h.rows=tab.rows.length; h.layout=tab.layout; h.err=tab.error||null;
      STATE.tabs[key]=tab;
    }
  }catch(e){ h.err=e.message; STATE.tabs[key]=null; }
  STATE.health[key]=h;
  return h;
}

/* ================================================================
   ANCHOR EXTRACTION per tab type
   ================================================================ */
function pnlAnchors(tab, healthKey){
  if(!tab||tab.error) return null;
  const h=STATE.health[healthKey];
  const A={};
  A.sales   = tab.findAny(["sales","revenue","total revenue"]);
  A.moonRev = tab.findAny(["moontech total"]);          // "MoonTech- Total" (revenue section, first hit)
  A.cos     = tab.findAny(["cost of sales","cogs","cost of revenue"]);
  A.cpxRev  = tab.findAny(["cpx mars total total","cpx mars total"]); // revenue section first hit
  A.gp      = tab.findAny(["gross profit"]);
  A.moonCost= A.cos ? tab.findAny(["moontech total"], A.cos) : null;
  A.cpxCost = A.cos ? tab.findAny(["cpx mars total"], A.cos) : null;
  A.expHdr  = A.gp ? tab.find("Expenses", A.gp) : tab.find("Expenses");
  A.totExp  = tab.findAny(["total expenses","total opex"]);
  A.net     = tab.findAny(["net earnings","net profit","net income","net result"]);
  const req={sales:"Sales",cos:"Cost of Sales",gp:"Gross Profit",totExp:"Total Expenses",net:"Net Earnings"};
  Object.entries(req).forEach(([k,lbl])=>{ if(A[k]) h.anchors.push(lbl); else h.missing.push(lbl); });
  ["moonRev","cpxRev","moonCost","cpxCost"].forEach(k=>{ if(A[k]) h.anchors.push(k); });
  return A;
}
function cashAnchors(tab, healthKey){
  if(!tab||tab.error) return null;
  const h=STATE.health[healthKey];
  const A={};
  A.opening = tab.findAny(["opening balance","opening cash","beginning balance","cash at beginning"]);
  A.inflow  = tab.findAny(["total inflow","total inflows","total receipts","total collections","total cash in"]);
  A.outflow = tab.findAny(["total outflow","total outflows","total payments","total cash out","total expenses"]);
  A.net     = tab.findAny(["net cashflow","net cash flow","net movement","net cash","surplus deficit"]);
  A.closing = tab.findAny(["closing balance","closing cash","ending balance","cash at end"]);
  Object.entries({opening:"Opening balance",inflow:"Total inflows",outflow:"Total outflows",net:"Net cashflow",closing:"Closing balance"})
    .forEach(([k,lbl])=>{ if(A[k]) h.anchors.push(lbl); else h.missing.push(lbl); });
  return A;
}

/* ================================================================
   CHART HELPERS
   ================================================================ */
function cssVar(n){return getComputedStyle(document.documentElement).getPropertyValue(n).trim();}
let TIP=null;
function tip(){
  if(TIP) return TIP;
  TIP={backgroundColor:"#1A2230",titleColor:"#fff",bodyColor:"#D5DAE2",borderColor:"#2A3240",borderWidth:1,
       padding:10,cornerRadius:6,titleFont:{weight:"600"},displayColors:true,boxPadding:4,
       callbacks:{label:(c)=>` ${c.dataset.label!=null?c.dataset.label+": ":""}${moneyPlain(c.parsed.y!=null?c.parsed.y:c.parsed)}`}};
  return TIP;
}
function baseOpts(extra){
  return Object.assign({
    responsive:true,maintainAspectRatio:false,
    animation:matchMedia("(prefers-reduced-motion: reduce)").matches?false:{duration:500},
    interaction:{intersect:false,mode:"index"},
    plugins:{legend:{display:false},tooltip:tip()},
    scales:{
      x:{grid:{display:false},ticks:{color:cssVar("--muted")}},
      y:{beginAtZero:true,grid:{color:cssVar("--line2")},border:{display:false},
         ticks:{color:cssVar("--muted"),callback:v=>fK(v)}}
    }
  },extra||{});
}
function mkChart(id,cfg){
  const el=document.getElementById(id);
  if(!el) return;
  const ch=new Chart(el.getContext("2d"),cfg);
  STATE.charts.push(ch);
  return ch;
}
/* per-month bar colors: actual vs forecast, by section palette */
function moColors(lastActual, actualColor, fctColor){
  return MONTHS_S.map((_,i)=> i<=lastActual?actualColor:fctColor);
}
function sparkline(id, data, color){
  const el=document.getElementById(id); if(!el) return;
  const ctx=el.getContext("2d");
  const g=ctx.createLinearGradient(0,0,0,34);
  g.addColorStop(0,color+"44"); g.addColorStop(1,color+"00");
  mkChart(id,{type:"line",data:{labels:data.map((_,i)=>i),datasets:[{data,borderColor:color,backgroundColor:g,fill:true,borderWidth:1.6,pointRadius:0,tension:.35}]},
    options:{responsive:true,maintainAspectRatio:false,animation:false,plugins:{legend:{display:false},tooltip:{enabled:false}},
      scales:{x:{display:false},y:{display:false}}}});
}

/* ================================================================
   PAGE RENDERERS
   ================================================================ */
function kpiTile(eyebrow, valueHTML, chipHTML, sparkId){
  return `<div class="card"><div class="eyebrow">${eyebrow}</div>
    <div class="big sm tnum">${valueHTML}</div>
    <div style="margin-top:6px">${chipHTML||""}</div>
    ${sparkId?`<div class="spark"><canvas id="${sparkId}"></canvas></div>`:""}</div>`;
}
function monthTh(pal){ // pal: 'pnl' (actual orange / fct blue) or 'cash' (actual blue / fct grey)
  const la = pal==="pnl"?CONFIG.LAST_ACTUAL.pnl:CONFIG.LAST_ACTUAL.cash;
  return MONTHS_S.map((m,i)=>{
    const cls = pal==="pnl" ? (i<=la?"mo-a":"mo-f") : (i<=la?"mo-a-c":"mo-f-c");
    return `<th class="${cls}">${m}</th>`;
  }).join("");
}
function rowCells(vals, la, opts={}){
  return vals.map((v,i)=>{
    const cls=i<=la?"act":"fct";
    const txt=opts.pct?pct(v!=null?v/100:null,0):moneyPlain(v);
    const col=opts.signColor&&v!=null?(v<0?' style="color:var(--red)"':(opts.greenPos?' style="color:var(--green)"':"")):"";
    return `<td class="tnum ${cls}"${col}>${txt}</td>`;
  }).join("");
}

/* ---------- CASHFLOW COCKPIT ---------- */
function renderCashCockpit(){
  const el=document.getElementById("pg-cash-cockpit");
  const la=CONFIG.LAST_ACTUAL.cash;
  const tab=STATE.tabs.cf_group;
  const vtab=STATE.tabs.cf_var;
  if(!tab||tab.error){ el.innerHTML=`<h1>Cashflow Cockpit</h1><div class="note">The Group cashflow tab could not be fetched/parsed (${esc(STATE.health.cf_group&&STATE.health.cf_group.err||"unknown")}). See Data &amp; Method for the fix.</div>`; return; }
  const A=STATE.A.cfg;
  const S=r=>r?seriesVal(r,la,tab):null;
  const inflow=S(A.inflow), outflow=S(A.outflow), netc=S(A.net), closing=S(A.closing), opening=S(A.opening);

  /* burn = avg monthly net cash movement over actual months where negative */
  let burn=null;
  if(netc){
    const acts=netc.actual.filter(v=>v!=null);
    if(acts.length) burn=-(acts.reduce((a,b)=>a+b,0)/acts.length);
  }else if(inflow&&outflow){
    let s=0,n=0; for(let m=0;m<=la;m++){ if(inflow.actual[m]!=null&&outflow.actual[m]!=null){s+=Math.abs(outflow.actual[m])-inflow.actual[m];n++;} }
    if(n) burn=s/n;
  }
  const latestCash=closing?closing.actual[la]!=null?closing.actual[la]:closing.display[la]:null;
  const runway=(burn!=null&&burn>0&&latestCash!=null)?latestCash/burn:null;
  const ytdIn=inflow?sum(inflow.display,0,la):null, ytdOut=outflow?Math.abs(sum(outflow.display,0,la)):null;

  /* forecast accuracy from variance tab if it parsed with paired layout */
  let cfAcc=null;
  const mA=STATE.A.moonCash, moonTab=STATE.tabs.cf_moon;
  const cA=STATE.A.cpxCash, cpxTab=STATE.tabs.cf_cpx;
  function entCard(name, EA, etab){

/* ---------- VC INVESTMENT ---------- */
function parseUsage(usage, amount){
  /* returns [{q:"Q4 2025", amt}] — parses strings like "Q4 2025", "30 K - Q2 , 20K Q3 - 2026", "50K Q3, 50K Q4 2026" */
  if(!usage) return [];
  const s=String(usage);
  const parts=s.split(/,/);
  const out=[];
  let defaultYear=null;
  const ym=s.match(/20\d\d/g); if(ym) defaultYear=ym[ym.length-1];
  parts.forEach(p=>{
    const qm=p.match(/Q\s*([1-4])/i); if(!qm) return;
    const yq=p.match(/20\d\d/);
    const am=p.match(/([\d.]+)\s*[Kk]/);
    out.push({q:"Q"+qm[1]+" "+(yq?yq[0]:(defaultYear||"")), amt:am?parseFloat(am[1])*1000:null});
  });
  if(out.length===1&&out[0].amt==null) out[0].amt=amount;
  if(out.length>1){
    const known=out.reduce((a,o)=>a+(o.amt||0),0);
    const un=out.filter(o=>o.amt==null);
    if(un.length&&amount!=null) un.forEach(o=>o.amt=(amount-known)/un.length);
  }
  return out;
}
function renderVC(){
  const el=document.getElementById("pg-vc");
  const h=STATE.health.cf_invest;
  const raw=h&&h.raw;
  if(!raw){ el.innerHTML=`<h1>VC Investment</h1><div class="note">Investment Summary tab could not be fetched (${esc(h&&h.err||"unknown")}).</div>`; return; }
  /* structure: header row with Investor Name / Indicative Amount / Status / Usage / Deployment Status */
  let hdrIdx=-1;
  raw.forEach((r,i)=>{ if(hdrIdx<0 && r.some(c=>/investor name/i.test(c))) hdrIdx=i; });
  const investors=[];
  if(hdrIdx>=0){
    for(let i=hdrIdx+1;i<raw.length;i++){
      const r=raw[i]; const name=String(r[0]||"").trim();
      if(!name) continue;
      if(/^total/i.test(name)){ break; }
      investors.push({name, amount:num(r[1]), status:String(r[2]||"").trim(), usage:String(r[3]||"").trim(), deploy:num(r[4])});
    }
  }
  const active=investors.filter(v=>!/cancel/i.test(v.status));
  const cancelled=investors.filter(v=>/cancel/i.test(v.status));
  const received=active.filter(v=>/transferred|received/i.test(v.status));
  const totCommit=active.reduce((a,v)=>a+(v.amount||0),0);
  const totReceived=received.reduce((a,v)=>a+(v.amount||0),0);
  /* deployment by quarter */
  const byQ={};
  active.forEach(v=>parseUsage(v.usage,v.amount).forEach(u=>{ if(!u.q.trim())return; byQ[u.q]=byQ[u.q]||{total:0,who:[]}; byQ[u.q].total+=u.amt||0; if(u.amt) byQ[u.q].who.push(v.name.trim()+" "+fK(u.amt).replace("K","K")); }));
  const qOrder=Object.keys(byQ).sort((a,b)=>{const pa=a.split(" "),pb=b.split(" ");return (pa[1]||"")===(pb[1]||"")?pa[0].localeCompare(pb[0]):(pa[1]||"").localeCompare(pb[1]||"");});
  /* deployed vs pending: weight by Deployment Status % when present */
  let deployed=0;
  active.forEach(v=>{ if(v.deploy!=null&&v.amount!=null) deployed+=v.amount*(v.deploy/100); });
  const knownDeploy=active.filter(v=>v.deploy!=null&&v.amount!=null).reduce((a,v)=>a+v.amount,0);
  const pendingNext=active.flatMap(v=>{
    const us=parseUsage(v.usage,v.amount);
    const undone=(v.deploy==null||v.deploy<100);
    return undone?us.filter(u=>/Q4 2026/.test(u.q)).map(u=>({name:v.name.trim(),amt:u.amt,q:u.q})):[];
  });

  el.innerHTML=`
  <div class="hrow"><div><h1>VC Investment</h1><div class="psub">Investment Summary · live · figures in USD</div></div></div>
  <div class="grid">
    <div class="col12"><div class="ktiles">
      ${kpiTile("Committed (active)", money(totCommit,"$"), cancelled.length?`<span class="chip n">${cancelled.length} cancelled excl.</span>`:"","")}
      ${kpiTile("Funds received", money(totReceived,"$"), `<span class="chip g">${received.length} of ${active.length} investors</span>`,"")}
      ${kpiTile("Deployed (weighted)", money(deployed,"$"), `<span class="chip n">of ${money(knownDeploy,"$").replace("$ ","$")} with % reported</span>`,"")}
      ${kpiTile("Pending next Q (Q4 26)", money(pendingNext.reduce((a,p)=>a+(p.amt||0),0),"$"), pendingNext.length?`<span class="chip b">${pendingNext.map(p=>p.name).join(", ")}</span>`:'<span class="chip n">none flagged</span>',"")}
    </div></div>

    <div class="card p0 col7">
      <div class="chd"><div class="eyebrow">Deployment plan</div><div class="ctitle">Capital by quarter of usage</div></div>
      <div class="chartbox"><canvas id="ch-vcq"></canvas></div>
    </div>
    <div class="card p0 col5">
      <div class="chd"><div class="eyebrow">Who invested</div><div class="ctitle">Ticket sizes</div></div>
      <div class="chartbox"><canvas id="ch-vcw"></canvas></div>
    </div>

    <div class="card p0 col12">
      <div class="chd"><div class="eyebrow">Register</div><div class="ctitle">Investor by investor</div></div>
      <div class="twrap"><table id="tbl-vc"></table></div>
    </div>
  </div>`;

  mkChart("ch-vcq",{type:"bar",data:{labels:qOrder,datasets:[{label:"Deployment",data:qOrder.map(q=>byQ[q].total),
    backgroundColor:qOrder.map(q=>/2026/.test(q)&&/Q4/.test(q)?cssVar("--brand"):cssVar("--ink")),borderRadius:5}]},
    options:baseOpts({plugins:{legend:{display:false},tooltip:Object.assign({},tip(),{callbacks:{label:c=>" $"+Math.round(c.parsed.y).toLocaleString(),afterLabel:c=>byQ[qOrder[c.dataIndex]].who.join("\n")}})}})});
  const sorted=[...active].sort((a,b)=>(b.amount||0)-(a.amount||0));
  mkChart("ch-vcw",{type:"bar",data:{labels:sorted.map(v=>v.name.trim()),datasets:[{data:sorted.map(v=>v.amount),backgroundColor:cssVar("--brand-mid"),borderRadius:5}]},
    options:baseOpts({indexAxis:"y",scales:{x:{beginAtZero:true,grid:{color:cssVar("--line2")},border:{display:false},ticks:{color:cssVar("--muted"),callback:v=>"$"+fK(v)}},y:{grid:{display:false},ticks:{color:cssVar("--muted")}}}})});

  const t=document.getElementById("tbl-vc");
  t.innerHTML=`<thead><tr><th>Investor</th><th>Amount</th><th style="text-align:left">Status</th><th style="text-align:left">Usage</th><th>Deployed</th></tr></thead><tbody>`+
    investors.map(v=>{
      const st=/cancel/i.test(v.status)?'<span class="chip r">Cancelled</span>':(/transferred|received/i.test(v.status)?'<span class="chip g">Received</span>':`<span class="chip n">${esc(v.status||"—")}</span>`);
      const dp=v.deploy==null?'<span class="chip n">—</span>':(v.deploy>=100?'<span class="chip g">100%</span>':`<span class="chip o">${v.deploy}%</span>`);
      return `<tr${/cancel/i.test(v.status)?' class="muted"':''}><td>${esc(v.name)}</td><td class="tnum">${v.amount!=null?"$"+Math.round(v.amount).toLocaleString():"—"}</td><td style="text-align:left">${st}</td><td style="text-align:left">${esc(v.usage||"—")}</td><td>${dp}</td></tr>`;
    }).join("")+`<tr class="band"><td>Total (active)</td><td class="tnum">$${Math.round(totCommit).toLocaleString()}</td><td></td><td></td><td></td></tr></tbody>`;
}

}
